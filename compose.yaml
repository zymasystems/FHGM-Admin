services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fhgm
      POSTGRES_USER: fhgm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhgm -d fhgm"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=db;Database=fhgm;Username=fhgm;Password=${POSTGRES_PASSWORD}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:?Set BOOTSTRAP_EMAIL in .env}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD in .env}
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - protection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  protection_keys:
