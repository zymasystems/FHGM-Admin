name: Build and integration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fhgm
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: fhgm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fhgm -d fhgm_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ConnectionStrings__Default: Host=localhost;Database=fhgm_test;Username=fhgm;Password=ci-only-database-password
      Bootstrap__Email: admin@example.org
      Bootstrap__Password: CiOnly-Admin-Tests-483!
      ASPNETCORE_ENVIRONMENT: Development
      R2__AccountId: test
      R2__Bucket: fhgm-test
      R2__AccessKeyId: test
      R2__SecretAccessKey: test
      R2__PublicBaseUrl: http://127.0.0.1:9002/fhgm-test
      R2__DevelopmentEndpoint: http://127.0.0.1:9002
      Media__PublicBaseUrl: http://127.0.0.1:9002/fhgm-test
      Media__DevelopmentStorageOrigin: http://127.0.0.1:9002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Tests/requirements.txt
      - run: dotnet build FHGM-Admin.sln -c Release --nologo
      - run: node --check Frontend/wwwroot/admin/app.js && node --check Frontend/wwwroot/public/app.js && node --check Frontend/wwwroot/admin/gallery.js && node --check Frontend/wwwroot/public/gallery-widget.js && node --check Frontend/wwwroot/admin/church-content.js && node --check Frontend/wwwroot/admin/monitoring.js && node --check Frontend/wwwroot/public/church-content.js
      - run: dotnet bin/Release/net10.0/FHGM.Backend.dll --initialize
        working-directory: Backend
      - name: Exercise MVC and private API against PostgreSQL
        shell: bash
        run: |
          python3 -m moto.server -H 127.0.0.1 -p 9002 > /tmp/fhgm-storage.log 2>&1 &
          storage_pid=$!
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9002/; then break; fi
            sleep 1
          done
          python3 Tests/setup_storage.py
          (cd Backend && ASPNETCORE_URLS=http://127.0.0.1:5081 dotnet bin/Release/net10.0/FHGM.Backend.dll) > /tmp/fhgm-backend.log 2>&1 &
          backend_pid=$!
          (cd Frontend && ASPNETCORE_URLS=http://127.0.0.1:5080 dotnet bin/Release/net10.0/FHGM.Admin.dll) > /tmp/fhgm-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" "$storage_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5080/health/ready; then break; fi
            sleep 1
          done
          if ! python3 Tests/church_content_integration.py; then cat /tmp/fhgm-backend.log /tmp/fhgm-frontend.log; exit 1; fi
      - name: Validate Compose and build both container images
        env:
          POSTGRES_PASSWORD: ci-only-build-password
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml build
